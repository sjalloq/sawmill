[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sawmill-parser"
dynamic = ["version"]
description = "A configurable TUI for post-processing and filtering structured tool logs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sawmill Contributors"}
]
keywords = ["tui", "log", "filter", "eda", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

dependencies = [
    "textual>=0.40.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "pydantic>=2.0.0",
    "rich-click>=1.7.0",
    "pluggy>=1.3.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx",
    "furo",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
]

[project.scripts]
sawmill = "sawmill.__main__:cli"

[project.urls]
Homepage = "https://github.com/sawmill/sawmill"
Documentation = "https://github.com/sawmill/sawmill#readme"
Repository = "https://github.com/sawmill/sawmill"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["sawmill"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax)
    "B",    # bugbear (common pitfalls)
    "SIM",  # simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"sawmill/tui/**" = ["RUF012"]  # Textual uses mutable class attrs (BINDINGS, CSS_PATH, etc.)

[tool.ruff.lint.isort]
known-first-party = ["sawmill"]
